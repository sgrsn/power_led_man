; ATtiny85 RGB power LED driver (bare avr-libc, no framework).

[env:attiny85]
platform = atmelavr
board = attiny85
board_build.f_cpu = 8000000L

; Internal 8 MHz RC (CKDIV8 off), BOD 2.7 V, SPI programming enabled.
; Write with:  pio run -t fuses
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDD
board_fuses.efuse = 0xFF

; Arduino UNO running ArduinoISP (tools/arduino_isp) as the programmer.
upload_protocol = stk500v1
upload_port = /dev/ttyACM0
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

[env:native]
; Host-side tests of the Patterns:  pio test -e native
platform = native
build_src_filter = +<patterns.c> +<lamp.c> +<duty.c> +<tables.c>
test_build_src = yes
